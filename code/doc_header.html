<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light dark;
  --plane:#f7f7f4; --surface:#fcfcfb; --surface-2:#efeeea;
  --ink:#0b0b0b; --ink-2:#4d4c49; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:#b9b8b0;
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c7:#4a3aa7;
  --neg:#e34948;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --sans:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --wide:1100px; --measure:620px; --gutter:20px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --plane:#111110; --surface:#1a1a19; --surface-2:#242422;
    --ink:#f4f4f1; --ink-2:#c3c2b7; --muted:#8f8e88;
    --grid:#2c2c2a; --axis:#3d3d3a; --border:#4a4a46;
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c7:#9085e9;
    --neg:#e66767;
  }
}
:root[data-theme="dark"]{
  --plane:#111110; --surface:#1a1a19; --surface-2:#242422;
  --ink:#f4f4f1; --ink-2:#c3c2b7; --muted:#8f8e88;
  --grid:#2c2c2a; --axis:#3d3d3a; --border:#4a4a46;
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c7:#9085e9;
  --neg:#e66767;
}
*{box-sizing:border-box}
html{background:var(--plane)}
body{margin:0; background:var(--plane); color:var(--ink); font-family:var(--serif);
  font-size:1.125rem; line-height:1.6; -webkit-font-smoothing:antialiased}
a{color:var(--c1)}
a:focus-visible{outline:2px solid var(--c1); outline-offset:2px}
.wrap{max-width:var(--wide); margin:0 auto; padding:0 var(--gutter)}
.prose, .prose-wide{max-width:var(--measure); margin-left:auto; margin-right:auto}
.prose p, .prose ul, .prose ol{margin:0 0 1.15em}
.prose li{margin-bottom:.35em}
.lead{font-size:1.2rem}
nav.top{position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--plane) 88%, transparent);
  backdrop-filter:blur(8px); border-bottom:1px solid var(--grid); font-family:var(--sans); font-size:.88rem}
nav.top .wrap{display:flex; gap:18px; align-items:center; min-height:46px; flex-wrap:wrap}
nav.top .brand{font-family:var(--serif); font-weight:700; color:var(--ink); margin-right:auto}
nav.top .links{display:flex; gap:16px; flex-wrap:wrap}
nav.top a{color:var(--ink-2); text-decoration:none; border-bottom:2px solid transparent; padding:12px 0}
nav.top a:hover{border-bottom-color:var(--axis)}
header.mast{text-align:center; padding:3.2rem 0 1.4rem}
.kicker{font-family:var(--sans); font-size:.78rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600}
h1{font-family:var(--serif); font-weight:700; font-size:clamp(1.8rem,4.2vw,3rem); line-height:1.1; letter-spacing:-.01em;
  max-width:26ch; margin:.6rem auto .8rem; text-wrap:balance}
.deck{font-size:clamp(1.15rem,2vw,1.4rem); line-height:1.4; color:var(--ink-2); max-width:44ch; margin:0 auto 1rem}
.byline{font-family:var(--sans); font-size:.9rem; color:var(--muted)}
.byline b{color:var(--ink); font-weight:600}
h2{font-family:var(--serif); font-weight:700; font-size:clamp(1.7rem,3.4vw,2.4rem); line-height:1.15; margin:3.4rem auto 1rem; max-width:var(--measure)}
h2 small{display:block; font-family:var(--sans); font-size:.78rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:.4rem}
h1 a, h2 a, h3 a{color:inherit; text-decoration:none}
h3{font-family:var(--sans); font-size:1.02rem; font-weight:600; margin:1.6rem 0 .5rem}
.chart h3{font-family:var(--serif); font-size:1.15rem; font-weight:700; line-height:1.3; margin:0 0 .6rem}
figure{margin:0}
figure.chart{margin:1.4rem auto; max-width:var(--wide)}
.card{background:var(--surface); border:1px solid var(--grid); border-radius:8px; padding:1rem 1.1rem}
figure.chart img{display:block; width:100%; height:auto; background:#fff; border-radius:4px}
figcaption{font-family:var(--sans); font-size:.86rem; color:var(--muted); line-height:1.45; margin-top:.5rem}
figcaption b{color:var(--ink-2); font-weight:600}
.tiles{display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); gap:10px; max-width:var(--wide); margin:1.4rem auto}
.tile{background:var(--surface); border:1px solid var(--grid); border-radius:6px; padding:.8rem .9rem; font-family:var(--sans)}
.tile .v{font-size:1.7rem; font-weight:600; line-height:1.1; color:var(--ink)}
.tile .l{font-size:.84rem; color:var(--ink-2); margin-top:.2rem}
.tile .d{font-size:.78rem; color:var(--muted)}
.pull{border-left:3px solid var(--c2); padding-left:1rem; margin:1.6rem auto; font-size:1.25rem; line-height:1.4; color:var(--ink); max-width:var(--measure)}
.box{background:var(--surface-2); border-left:3px solid var(--c1); border-radius:6px; padding:.9rem 1.1rem; margin:1.4rem auto;
  font-family:var(--sans); font-size:.98rem; line-height:1.5; max-width:var(--measure)}
.box h4{font-family:var(--serif); font-size:1.05rem; margin:0 0 .4rem}
.box p{margin:0 0 .6em}
.methods{font-family:var(--sans); font-size:.95rem; background:var(--surface); border:1px solid var(--grid); border-radius:8px;
  padding:1.2rem 1.3rem; margin:1.4rem auto; max-width:var(--wide)}
.methods h3{font-family:var(--serif); font-size:1.3rem; font-weight:700; margin:0 0 .8rem}
.methods dl{display:grid; grid-template-columns:minmax(140px, 220px) 1fr; gap:.5rem 1.2rem; margin:0}
.methods dt{color:var(--muted); font-weight:600}
.methods dd{margin:0}
.files{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:10px; margin-top:.8rem}
.f{background:var(--surface-2); border:1px solid var(--grid); border-radius:6px; padding:.7rem .8rem}
.f code{font-size:.8rem}
.f div{font-size:.78rem; color:var(--muted); margin-top:.25rem}
.cite{font-family:var(--sans); font-size:.9rem; background:var(--surface); border:1px solid var(--grid); border-radius:6px;
  padding:.8rem 1rem; margin:1.4rem auto; max-width:var(--wide)}
footer{padding:2rem 0 3rem; margin-top:2.5rem; border-top:1px solid var(--grid); color:var(--muted); font-family:var(--sans); font-size:.86rem}
code{font-family:var(--mono); font-size:.88em; background:var(--surface-2); padding:1px 5px; border-radius:3px}
pre{font-family:var(--mono); font-size:.8rem; line-height:1.45; background:var(--surface-2); border:1px solid var(--grid);
  border-radius:6px; padding:.8rem 1rem; overflow-x:auto; max-width:var(--wide); margin:1rem auto}
pre code{background:none; padding:0; font-size:inherit}
.tbl-link{background:none; border:0; padding:0; font-family:var(--sans); font-size:.82rem; color:var(--ink-2); text-decoration:underline; cursor:pointer; margin-top:.6rem}
.tbl-view{display:none; margin-top:.8rem; overflow-x:auto}
.tbl-view.on{display:block}
details.tbl{margin-top:.6rem; font-family:var(--sans)}
details.tbl summary{font-size:.82rem; color:var(--ink-2); text-decoration:underline; cursor:pointer}
details.tbl .scroller{overflow-x:auto; margin-top:.6rem}
table.dt{border-collapse:collapse; width:100%; font-family:var(--sans); font-size:.84rem; font-variant-numeric:tabular-nums}
table.dt th, table.dt td{border-bottom:1px solid var(--grid); padding:.3rem .45rem; text-align:right; vertical-align:top}
table.dt th:first-child, table.dt td:first-child{text-align:left}
table.dt thead th{background:var(--surface-2); color:var(--ink-2); font-weight:600; text-align:right}
table.dt thead th:first-child{text-align:left}
.tbl-title{font-family:var(--sans); font-size:.86rem; color:var(--ink-2); font-weight:600; margin:0 0 .4rem}
table:not(.dt){border-collapse:collapse; font-family:var(--sans); font-size:.9rem; margin:1rem auto; max-width:var(--wide)}
table:not(.dt) th, table:not(.dt) td{border-bottom:1px solid var(--grid); padding:.3rem .6rem; text-align:left; vertical-align:top}
table:not(.dt) th{background:var(--surface-2); color:var(--ink-2); font-weight:600}
.manual h1{text-align:left; margin-left:0; max-width:none}
.manual h2{max-width:none; margin-left:0}
.manual > p, .manual > ul, .manual > ol{max-width:var(--measure); margin-left:auto; margin-right:auto}
.manual .step{background:var(--surface); border:1px solid var(--grid); border-radius:8px; padding:1rem 1.2rem; margin:1.2rem auto; max-width:var(--wide); font-family:var(--sans); font-size:.95rem}
.manual .step h4{margin:.2rem 0 .3rem; font-family:var(--serif); font-size:1.05rem}
@media (max-width:820px){ body{font-size:1.05rem} .methods dl{grid-template-columns:1fr}
  nav.top{position:static} nav.top .wrap{gap:10px 14px; padding-top:8px; padding-bottom:8px} nav.top a{padding:2px 0} }
@media (prefers-reduced-motion: reduce){ *{transition:none !important} }
@media print{ nav.top{display:none} .tbl-view{display:block} }
</style>
